<!DOCTYPE html>
<html lang="en">
<head>

    <title>Product Cards</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

            <p>₹1,499</p>

        </div>

            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Watch">
            <h2>Smart Watch</h2>
            <p>₹2,999</p>

        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Headphones">

            <p>₹899</p>

            <h2>Laptop</h2>
            <p>₹49,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="Mobile">

            <p>₹19,999</p>
