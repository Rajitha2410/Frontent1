<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Demonstration</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <h1>CSS Box Model Demonstration</h1>

    <!-- Student Card -->
    <div class="card">
        <img src="assets/css/student.png" alt="Student">
        <h2>Student Card</h2>
        <p>Name: Rahul</p>
        <p>Course: B.Sc CS</p>
    </div>

    <!-- Employee Card -->
    <div class="card">
        <img src="assets/css/infosy.webp" alt="Employee">
        <h2>Employee Card</h2>
        <p>Name: John</p>
        <p>Department: IT</p>
    </div>

    <!-- Product Card -->
    <div class="card">
        <img src="assets/css/head.avif" alt="Product">
        <h2>Product Card</h2>
        <p>Wireless Headphones</p>
        <p>Price: $49.99</p>
    </div>

    <!-- Movie Card -->
    <div class="card">
        <img src="assets/css/avenger.jpg" alt="Movie">
        <h2>Movie Card</h2>
        <p>Movie: Avengers</p>
        <p>Rating: ★★★★★</p>
    </div>

    <!-- Company Card -->
    <div class="card">
        <img src="assets/css/infosy.webp" alt="Company">
        <h2>Company Card</h2>
        <p>Company: ABC Technologies</p>
        <p>Location: Chennai</p>
    </div>

</body>
</html>
