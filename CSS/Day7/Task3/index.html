<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="card">
            <img src="assets/css/image/head.avif" alt="Product 1">
            <h3>Headphones</h3>
            <p>₹1,499</p>
        </div>

        <div class="card">
            <img src="assets/css/image/watch.jpg" alt="Product 2">
            <h3>Smart Watch</h3>
            <p>₹2,999</p>
        </div>

        <div class="card">
            <img src="assets/css/image/laptop.webp" alt="Product 3">
            <h3>Laptop</h3>
            <p>₹45,000</p>
        </div>

        <div class="card">
            <img src="assets/css/image/mobile.png" alt="Product 4">
            <h3>Mobile Phone</h3>
            <p>₹18,999</p>
        </div>

        <div class="card">
            <img src="assets/css/image/keyboard.avif" alt="Product 5">
            <h3>Keyboard</h3>
            <p>₹999</p>
        </div>

        <div class="card">
            <img src="assets/css/image/mouse.jpg" alt="Product 6">
            <h3>Mouse</h3>
            <p>₹699</p>
        </div>

        <div class="card">
            <img src="assets/css/image/speaker.jpg" alt="Product 7">
            <h3>Speaker</h3>
            <p>₹2,199</p>
        </div>

        <div class="card">
            <img src="assets/css/image/camera.avif" alt="Product 8">
            <h3>Camera</h3>
            <p>₹35,999</p>
        </div>

    </div>

</body>
</html>
