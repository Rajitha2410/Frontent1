<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Four Columns</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">
        <div class="row">

            <div class="col-3 bg-primary text-white p-4">
                <h3>Box 1</h3>
                <p>First Box</p>
            </div>

            <div class="col-3 bg-success text-white p-4">
                <h3>Box 2</h3>
                <p>Second Box</p>
            </div>

            <div class="col-3 bg-warning p-4">
                <h3>Box 3</h3>
                <p>Third Box</p>
            </div>

            <div class="col-3 bg-danger text-white p-4">
                <h3>Box 4</h3>
                <p>Fourth Box</p>
            </div>

        </div>
    </div>

</body>
</html>
