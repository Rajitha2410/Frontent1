<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<!-- NAVBAR -->

<nav class="bg-gray-900 text-white p-5">

    <div class="flex justify-between items-center">

        <h1 class="text-2xl font-bold text-blue-400">
            LIFE IN 2050
        </h1>

        <div class="flex gap-6">

            <a href="index.html" class="hover:text-blue-400">
                Home
            </a>

            <a href="future.html" class="hover:text-blue-400">
                Future Life
            </a>

            <a href="technology.html" class="hover:text-blue-400">
                Technology
            </a>

            <a href="transportation.html" class="hover:text-blue-400">
                Transportation
            </a>

            <a href="education.html" class="hover:text-blue-400">
                Education
            </a>

            <a href="contact.html" class="hover:text-blue-400">
                Contact
            </a>

        </div>

    </div>

</nav>


<!-- HEADER -->

<section class="bg-blue-900 text-white text-center p-16">

    <h1 class="text-5xl font-bold">
        Contact Us
    </h1>

    <p class="text-xl mt-5">
        Share your thoughts about the future
    </p>

</section>


<!-- CONTACT FORM -->

<section class="p-12">

    <div class="bg-white max-w-2xl mx-auto p-10 rounded-lg shadow">


        <h2 class="text-3xl font-bold text-blue-700 text-center">
            Send Us A Message
        </h2>


        <div class="mt-8">


            <label class="font-bold">
                Your Name
            </label>

            <input
                type="text"
                placeholder="Enter your name"
                class="w-full p-3 bg-gray-100 rounded mt-2"
            >


            <label class="font-bold block mt-5">
                Email
            </label>

            <input
                type="email"
                placeholder="Enter your email"
                class="w-full p-3 bg-gray-100 rounded mt-2"
            >


            <label class="font-bold block mt-5">
                Subject
            </label>

            <input
                type="text"
                placeholder="Enter subject"
                class="w-full p-3 bg-gray-100 rounded mt-2"
            >


            <label class="font-bold block mt-5">
                Message
            </label>

            <textarea
                rows="5"
                placeholder="Write your message"
                class="w-full p-3 bg-gray-100 rounded mt-2"
            ></textarea>


            <button
                class="bg-blue-500 hover:bg-blue-700
                       text-white px-6 py-3 rounded mt-6">

                Send Message

            </button>

        </div>

    </div>

</section>


<!-- FOOTER -->

<footer class="bg-gray-950 text-white text-center p-8">

    <h2 class="text-xl font-bold text-blue-400">
        LIFE IN 2050
    </h2>

    <p class="mt-3">
        The future begins with imagination.
    </p>

</footer>


</body>
</html>
