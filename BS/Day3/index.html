<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">Dream Travel</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Places</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>

        </div>
    </div>
</nav>


<!-- ================= CAROUSEL ================= -->

<div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#travelCarousel"
            data-bs-slide-to="0" class="active"></button>

        <button type="button" data-bs-target="#travelCarousel"
            data-bs-slide-to="1"></button>

        <button type="button" data-bs-target="#travelCarousel"
            data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://picsum.photos/id/1018/1200/400"
                 class="d-block w-100"
                 alt="Travel Image">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1015/1200/400"
                 class="d-block w-100"
                 alt="Mountain">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1016/1200/400"
                 class="d-block w-100"
                 alt="Nature">
        </div>

    </div>

    <button class="carousel-control-prev"
        type="button"
        data-bs-target="#travelCarousel"
        data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next"
        type="button"
        data-bs-target="#travelCarousel"
        data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>
    </button>

</div>


<!-- ================= CARDS ================= -->

<section class="container my-5">

    <h2 class="text-center mb-4">Popular Places</h2>

    <div class="row g-4">

        <!-- Card 1 -->
        <div class="col-md-4">

            <div class="card h-100 shadow">

                <img src="https://picsum.photos/id/1036/500/300"
                     class="card-img-top"
                     alt="Beach">

                <div class="card-body">

                    <h5 class="card-title">Beach</h5>

                    <p class="card-text">
                        Enjoy beautiful beaches and peaceful nature.
                    </p>

                    <a href="#" class="btn btn-primary">
                        Explore
                    </a>

                </div>
            </div>

        </div>


        <!-- Card 2 -->
        <div class="col-md-4">

            <div class="card h-100 shadow">

                <img src="https://picsum.photos/id/1039/500/300"
                     class="card-img-top"
                     alt="Mountain">

                <div class="card-body">

                    <h5 class="card-title">Mountain</h5>

                    <p class="card-text">
                        Experience amazing mountains and fresh air.
                    </p>

                    <a href="#" class="btn btn-success">
                        Explore
                    </a>

                </div>
            </div>

        </div>


        <!-- Card 3 -->
        <div class="col-md-4">

            <div class="card h-100 shadow">

                <img src="https://picsum.photos/id/1043/500/300"
                     class="card-img-top"
                     alt="Forest">

                <div class="card-body">

                    <h5 class="card-title">Forest</h5>

                    <p class="card-text">
                        Discover beautiful forests and natural places.
                    </p>

                    <a href="#" class="btn btn-warning">
                        Explore
                    </a>

                </div>
            </div>

        </div>

    </div>

</section>


<!-- ================= FORM ================= -->

<section class="container mb-5">

    <h2 class="text-center mb-4">Contact Us</h2>

    <form class="p-4 bg-light shadow rounded">

        <div class="mb-3">

            <label class="form-label">
                Name
            </label>

            <input type="text"
                   class="form-control"
                   placeholder="Enter your name">

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   placeholder="Enter your email">

        </div>


        <div class="mb-3">

            <label class="form-label">
                Message
            </label>

            <textarea class="form-control"
                      rows="4"
                      placeholder="Enter your message"></textarea>

        </div>


        <button type="submit"
                class="btn btn-primary">
            Submit
        </button>

    </form>

</section>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
