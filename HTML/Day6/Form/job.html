<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>

<body>

    <center>

        <h1>JOB APPLICATION FORM</h1>

        

        <form>

            <label>Full Name :</label><br>
            <input type="text" name="fullname" required>

            <br><br>

            <label>Email :</label><br>
            <input type="email" name="email" required>

            <br><br>

            <label>Phone Number :</label><br>
            <input type="tel" name="phone">

            <br><br>

            <label>Address :</label><br>

            <textarea name="address" rows="4" cols="30"></textarea>

            <br><br>

            <label>Position Applied For :</label><br>

            <select>
                <option>Web Developer</option>
                <option>Software Developer</option>
                <option>Data Analyst</option>
                <option>Tester</option>
            </select>

            <br><br>

            <label>Qualification :</label><br>

            <select>
                <option>BCA</option>
                <option>B.Sc Computer Science</option>
                <option>B.Tech</option>
                <option>MCA</option>
            </select>

            <br><br>

            <label>Experience (Years) :</label><br>

            <input type="number" name="experience">

            <br><br>

            <label>Skills :</label><br>

            <textarea name="skills" rows="4" cols="30"></textarea>

            <br><br>

            <label>Upload Resume :</label><br>

            <input type="file" name="resume">

            <br><br>

            <label>Available Joining Date :</label><br>

            <input type="date" name="joiningdate">

            <br><br>

            <input type="submit" value="Apply Now">

            <input type="reset" value="Clear">

        </form>

        

        <a href="feedback.html">Previous</a> |

        <a href="index.html">Home</a>

    </center>

</body>
</html>
