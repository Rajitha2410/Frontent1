<!DOCTYPE html>
<html>
<head>
    <title>Media Showcase</title>
</head>
<body>

    <h1>Media Showcase</h1>

    <!-- 3 Images -->
    <h2>Images</h2>
    <img src="image/nature1.jpg"alt="Nature" width="200" height="150">
    <img src="image/nature2.jpg" alt="Mountain" width="200" height="150">
    <img src="image/nature3.jpg" alt="Beach" width="200" height="150">

    <hr>

    <!-- Audio -->
    <h2>Audio Player</h2>
    <audio controls>
        <source src="image/Audio1.mpeg" type="audio/mpeg">
        <source src="image/audio2.mpeg" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <hr>

    <!-- Video -->
    <h2>Video Player</h2>
    <video width="500" height="300" controls poster="image/nature1.jpg">
        <source src="image/Video1.mp4" type="video/mp4">
        <source src="image/video2.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <hr>

    <!-- YouTube -->
    <h2>YouTube Video</h2>
    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

    <hr>

    <!-- Google Map -->
    <h2>Google Map</h2>
    <iframe
        src="https://maps.google.com/maps?q=Chennai&t=&z=13&ie=UTF8&iwloc=&output=embed"
        width="600"
        height="450"
        style="border:0;"
        loading="lazy"
        allowfullscreen>
    </iframe>

    <hr>

    <!-- Embedded PDF -->
    <h2>PDF Document</h2>
    <iframe
        src="image/lek1.pdf"
        width="600"
        height="500">
    </iframe>

</body>
</html>
