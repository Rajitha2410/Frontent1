<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>
</head>
<body>

    <h2>Engineering College Admission Portal</h2>

    <form>

        <label for="sname">Student Name:</label><br>
        <input type="text" id="sname" name="sname"><br><br>

        <label for="fname">Father Name:</label><br>
        <input type="text" id="fname" name="fname"><br><br>

        <label for="mname">Mother Name:</label><br>
        <input type="text" id="mname" name="mname"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender">
        <label for="other">Other</label>
        <br><br>

        <label for="department">Department:</label><br>
        <select id="department" name="department">
            <option>--Select Department--</option>
            <option>Computer Science Engineering</option>
            <option>Information Technology</option>
            <option>Mechanical Engineering</option>
            <option>Electrical Engineering</option>
            <option>Electronics Engineering</option>
        </select>
        <br><br>

        <label for="percentage">Percentage:</label><br>
        <input type="number" id="percentage" name="percentage">
        <br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30"></textarea>
        <br><br>

        <label for="photo">Passport Size Photo:</label><br>
        <input type="file" id="photo" name="photo">
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
