<html>
    <head>
        <title>form method </title>
    </head>
    <body>
        <h2>Employee Registeration Form</h2>
        <form>
            <label for="empid"> Employe ID:</label><br>
            <input type="text" id="empid" name="empid"><br><br>
            <label for="empname">Employe Name:</label><br>
            <input type="text" id="empname" name="empname"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            <label for="mobile">Mobile:</label><br>
            <input type="tel" id="mobile" name="mobile"><br><br>
            <label for="department">Department:</label><br>
            
        <select id="department" name="department">
            <option>--Select Department--</option>
            <option>HR</option>
            <option>IT</option>
            <option>Finance</option>
            <option>Marketing</option>
        </select><br><br>

            <label for="experience">Experience:</label><br>
            <input type="experience" id="experience" name="experience">Years<br><br>
            <label for="salary">Salary:</label><br>
            <input type="salary" id="salary" name="salary"><br><br>
            <label="skills>Skills:</label><br>
            <input type="checkbox" id="html" name="skills">HTML<br>
            <input type="checkbox" id="css" name="skills">CSS<br>
            <input type="checkbox" id="js" name="skills">JS<br>
            <label for="resume">Resume Upload:</label><br>
            <input type="file" id="resume" name="resume"><br><br>

             <button type="submit">Submit</button>
             <button type="reset">Reset</button>

        </form>
    </body>
</html>
